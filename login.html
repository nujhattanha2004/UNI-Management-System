<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login - University Management System</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #263238;">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
          University Management System
        </a>

        <div class="navbar-nav ms-auto">
          <div class="navbar-nav ms-auto">
    <a class="nav-link text-white" href="index.html">Home</a>

    <a class="nav-link text-white" href="students.html">Students</a>

    <a class="nav-link text-white" href="teachers.html">Teachers</a>

    <a class="nav-link text-white" href="courses.html">Courses</a>

    <a class="nav-link text-white" href="department.html">Departments</a>

    <a class="nav-link text-white" href="contact.html">Contact</a>

    <a class="nav-link text-white" href="login.html">Login</a>

    <a class="nav-link text-white" href="register.html">Register</a>

    <a class="nav-link text-white" href="dashboard.html">Dashboard</a>
</div>
      </div>
    </nav>

    <!-- Login Section -->

    <section class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card shadow border-0">
            <div class="card-body p-5">
              <h2 class="text-center fw-bold"
    style="color: #6F4E37;">
    Login
</h2>

              <p class="text-center text-muted mb-4">
                Login to University Management System
              </p>

              <!-- Email -->

              <div class="mb-3">
                <label class="form-label fw-bold"> Email </label>

                <input
                  type="email"
                  class="form-control"
                  placeholder="Enter your email"
                />
              </div>

              <!-- Password -->

              <div class="mb-3">
                <label class="form-label fw-bold"> Password </label>

                <input
                  type="password"
                  class="form-control"
                  placeholder="Enter your password"
                />
              </div>

              <!-- User Type -->

              <div class="mb-4">
                <label class="form-label fw-bold"> User Type </label>

                <select class="form-select">
                  <option selected>Select User Type</option>

                  <option>Student</option>

                  <option>Teacher</option>

                  <option>Admin</option>
                </select>
              </div>

              <!-- Login Button -->

              <button type="submit"
        class="btn text-white w-100"
        style="background-color: #6F4E37;">
    Login
</button>

              <p class="text-center mt-4 mb-0">
                New user?
                <a href="register.html" class="text-primary">
                  Create an account
                </a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Footer -->

    <footer class="bg-primary text-white text-center py-4">
      <h5>University Management System</h5>

      <p class="mb-0">
        © 2026 University Management System. All Rights Reserved.
      </p>
    </footer>
  </body>
</html>
